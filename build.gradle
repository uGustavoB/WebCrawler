plugins {
    id 'groovy'
}

group = 'org.uGustavoDev'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.codehaus.groovy:groovy:3.0.22'
    implementation 'org.codehaus.groovy:groovy-xml:3.0.22'
    implementation 'org.codehaus.groovy:groovy-json:3.0.22'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.opencsv:opencsv:5.9'
    implementation("io.github.http-builder-ng:http-builder-ng-core:1.0.4")
    implementation 'org.slf4j:slf4j-simple:1.7.36'
}

test {
    useJUnitPlatform()
}